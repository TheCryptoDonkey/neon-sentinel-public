name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build client
        env:
          NEON_SOURCE_REVISION: ${{ github.sha }}
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Install recovery browser
        run: npx playwright install --with-deps chromium

      - name: Verify account-bound score recovery
        env:
          NEON_RECOVERY_EVIDENCE: ${{ github.workspace }}/neon-recovery-evidence.json
        run: npm run test:score-recovery

      - name: Verify real SDK keyboard ownership
        env:
          NEON_RECOVERY_EVIDENCE: ${{ github.workspace }}/neon-keyboard-evidence.json
        run: npm run test:signet-keyboard

      - name: Archive checked client
        uses: actions/upload-artifact@v6.0.0
        with:
          name: checked-client
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: Archive recovery proof
        uses: actions/upload-artifact@v6.0.0
        with:
          name: score-recovery-proof
          path: neon-recovery-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Fingerprint every checked client file
        run: node tools/client-manifest.mjs

      - name: Archive checked client manifest
        uses: actions/upload-artifact@v6.0.0
        with:
          name: checked-client-manifest
          path: neon-client-manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Archive checked client code
        uses: actions/upload-artifact@v6.0.0
        with:
          name: checked-client-code
          path: |
            dist/index.html
            dist/version.json
            dist/assets/
            dist/signet/
            dist/sw.js
            dist/manifest.webmanifest
            dist/privacy.html
            dist/support.html
          retention-days: 14
          if-no-files-found: error

      - name: Archive SDK keyboard proof
        uses: actions/upload-artifact@v6.0.0
        with:
          name: signet-keyboard-proof
          path: neon-keyboard-evidence.json
          retention-days: 14
          if-no-files-found: error
